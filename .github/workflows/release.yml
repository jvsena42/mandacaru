name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # SHA-256 of the certificate every published Mandacaru APK is signed with.
  # Android refuses updates signed by a different key, so a mismatch must fail
  # the release rather than ship an APK users cannot install over their copy.
  EXPECTED_CERT_SHA256: c10c8a3c3c3fc4ca31584ba99389af6f921280f083a67ec0511aace6e952910d

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout re-fetches the triggering tag as a lightweight ref,
      # dropping the annotation that carries the release notes.
      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z"; exit 1
          fi
          version="${TAG#v}"
          gradle_version=$(sed -nE 's/^val appVersionName = "(.*)"$/\1/p' app/build.gradle.kts)
          if [[ "$gradle_version" != "$version" ]]; then
            echo "::error::appVersionName is '$gradle_version' but the tag is $TAG"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          apk="app/build/outputs/apk/release/Mandacaru-${VERSION}.apk"
          test -f "$apk" || { echo "::error::$apk was not produced"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if ! grep -qi "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" <<< "$certs"; then
            echo "::error::APK is not signed with the Mandacaru release key"; exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Notes come from the annotated tag body (everything after the subject
      # line); a tag without one falls back to GitHub's generated notes.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          if [[ -s "$RUNNER_TEMP/notes.md" ]] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" "$APK" \
            --title "Mandacaru $TAG" \
            --verify-tag \
            --latest \
            "${notes[@]}"
